name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          FLASK_ENV: development
          SECRET_KEY: test-only-secret
        run: python -m pytest -q

  docker:
    name: Docker build and health smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag janaushadhi-saathi:ci .
      - name: Start container
        run: |
          docker run --detach --name janaushadhi-ci \
            --publish 8000:8000 \
            --env SECRET_KEY=ci-only-secret \
            janaushadhi-saathi:ci
      - name: Wait for health and check sample catalogue
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/health.json").read_text())
          assert data["status"] == "ok", data
          assert data["catalogue"]["official_data"] is False, data
          assert data["database"]["medicines"] > 0, data
          PY
          curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"text":"Tab Dolo 650"}' \
            http://127.0.0.1:8000/api/analyze > /tmp/analyze.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/analyze.json").read_text())
          assert data["ok"] is True, data
          assert data["selection"] is None, data
          assert all(item["status"] == "uncertain" for item in data["candidates"]), data
          PY
      - name: Container logs on failure
        if: failure()
        run: docker logs janaushadhi-ci
      - name: Stop container
        if: always()
        run: docker rm --force janaushadhi-ci || true
